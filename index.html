<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Lista de Compras</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1565c0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script>
  window.addEventListener("error", function (e) {
    var msg = (e && e.message) ? e.message : "erro desconhecido";
    var box = document.createElement("div");
    box.style.cssText = "background:#c62828;color:#fff;padding:14px;font-size:14px;white-space:pre-wrap;font-family:monospace;position:relative;z-index:999;";
    box.textContent = "ERRO: " + msg + (e.filename ? ("\n" + e.filename + ":" + e.lineno) : "");
    document.body.prepend(box);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
    var box = document.createElement("div");
    box.style.cssText = "background:#c62828;color:#fff;padding:14px;font-size:14px;white-space:pre-wrap;font-family:monospace;position:relative;z-index:999;";
    box.textContent = "ERRO (Firebase/promise): " + msg;
    document.body.prepend(box);
  });
</script>
<style>
  * { box-sizing: border-box; }
  :root { --accent: #1565c0; --accent-dark: #0d47a1; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    background: #fafafa;
    color: #222;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 16px 20px;
    padding-top: max(16px, env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .actions { display: flex; align-items: center; gap: 14px; }
  header a, header span.link { color: #cfe0f7; font-size: 13px; text-decoration: none; cursor: pointer; }
  main { padding: 16px; padding-bottom: 90px; max-width: 480px; margin: 0 auto; }
  .screen { display: none; }
  .screen.active { display: block; }

  .card {
    background: #f0f0f0;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .user-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .user-card .left { display: flex; align-items: center; gap: 10px; }
  .color-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.15); }
  .user-card .name { font-size: 16px; font-weight: 600; }
  .user-card .nick { font-size: 13px; color: #777; margin-top: 2px; }
  .user-card .edit-link { font-size: 12px; color: #1565c0; }

  input[type=text], input[type=date], input[type=number], select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 8px;
    background: #fff;
  }
  input[type=color] {
    width: 44px; height: 44px; border: none; border-radius: 8px; padding: 0;
    margin-bottom: 8px; background: none; cursor: pointer;
  }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row label { font-size: 13px; color: #666; }

  button {
    font-size: 15px;
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  button.secondary { background: #eee; color: #333; }
  button.green { background: #2e7d32; }
  button.red { background: #c62828; }
  button.small { padding: 6px 10px; font-size: 12px; border-radius: 6px; }
  button:disabled { opacity: .5; }

  .row { display: flex; gap: 8px; }
  .subtitle { font-size: 14px; color: #666; margin: 20px 0 8px; }

  .list-card { display: flex; flex-direction: column; }
  .list-card .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .list-card .date { font-size: 16px; font-weight: 600; text-transform: capitalize; }
  .list-card .meta { font-size: 12px; color: #777; margin-top: 4px; }
  .list-card .content { cursor: pointer; flex: 1; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: bold; white-space: nowrap; }
  .badge.done { background: #c8e6c9; color: #256029; }
  .badge.pending { background: #fff3cd; color: #8a6d00; }
  .list-card .delete-btn { color: #c62828; font-size: 12px; margin-top: 8px; align-self: flex-end; cursor: pointer; }

  .fab {
    position: fixed;
    bottom: 20px; left: 16px; right: 16px;
    max-width: 448px; margin: 0 auto;
    padding: 16px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }

  .list-header-bar { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .list-header-bar button { flex: 1; }
  .back-btn { display: flex; align-items: center; gap: 4px; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; padding: 4px 0; }

  .today-banner {
    background: #fff3cd; color: #8a6d00; border-radius: 10px; padding: 12px 14px;
    margin-bottom: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px;
    border-radius: 8px;
    margin-top: 16px; margin-bottom: 6px;
  }
  .section-header .title { font-weight: bold; }
  .section-header .progress { font-size: 13px; }

  .item-row { display: flex; align-items: center; padding: 10px 8px; gap: 10px; background: #fff; border-radius: 8px; margin-bottom: 6px; }
  .checkbox {
    width: 24px; height: 24px; border-radius: 6px;
    border: 2px solid #999;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
  }
  .checkbox.checked { background: #2e7d32; border-color: #2e7d32; color: #fff; }
  .item-info { flex: 1; min-width: 0; cursor: pointer; }
  .item-text { font-size: 16px; }
  .item-text.done { text-decoration: line-through; color: #999; }
  .item-qty { font-size: 12px; color: #777; margin-top: 2px; }
  .item-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
  .icon-btn { font-size: 16px; cursor: pointer; padding: 4px; }
  .price-pill {
    background: #c8e6c9; color: #256029; font-size: 12px; font-weight: bold;
    padding: 4px 10px; border-radius: 12px; white-space: nowrap;
  }

  .total-banner {
    background: var(--accent); color: #fff; border-radius: 10px;
    padding: 14px; margin-bottom: 14px; text-align: center;
  }
  .total-banner .label { font-size: 12px; opacity: .85; }
  .total-banner .value { font-size: 24px; font-weight: bold; margin-top: 2px; }

  .month-heading {
    font-size: 15px; font-weight: bold; color: #444; margin: 22px 0 8px;
    padding-bottom: 4px; border-bottom: 2px solid #eee;
  }
  .month-total {
    background: #eef2f7; color: #333; font-size: 13px; font-weight: 600;
    padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; text-align: right;
  }

  .empty { color: #999; font-style: italic; margin: 16px 0; }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.active { display: flex; }
  .modal-card {
    background: #fff;
    width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    padding-bottom: max(28px, env(safe-area-inset-bottom));
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-card h3 { margin-top: 0; }
  .suggestion-box { border: 1px solid #eee; border-radius: 8px; max-height: 160px; overflow-y: auto; margin-bottom: 8px; }
  .suggestion-item { padding: 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0 12px; }
  .chip {
    padding: 8px 14px; border-radius: 20px;
    white-space: nowrap; cursor: pointer; font-size: 14px;
    border: 2px solid transparent;
  }
  .chip.selected { font-weight: bold; border-color: #222; }
  .qty-row { display: flex; gap: 8px; }
  .qty-row input { flex: 1; }
  .qty-row select { flex: 1; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { flex: 1; }
</style>
</head>
<body>

<header>
  <h1 id="headerTitle">Lista de Compras</h1>
  <div class="actions">
    <span class="link" id="switchUserLink" style="display:none">trocar usuário</span>
  </div>
</header>

<main>

  <!-- TELA: selecionar usuário -->
  <section id="screen-user" class="screen">
    <h2>Selecione seu nome</h2>
    <div id="userList"></div>
    <p class="subtitle">Ou cadastre um novo nome:</p>
    <input type="text" id="newUserName" placeholder="Ex: Douglas" />
    <input type="text" id="newUserNick" placeholder="Apelido (opcional, ex: Dodô)" />
    <div class="color-row">
      <label for="newUserColor">Cor:</label>
      <input type="color" id="newUserColor" value="#1565c0" />
    </div>
    <button id="createUserBtn" style="width:100%">Salvar</button>
  </section>

  <!-- TELA: listas por data -->
  <section id="screen-lists" class="screen">
    <p id="helloText" style="font-size:16px;font-weight:bold;"></p>
    <div id="todayBanner"></div>
    <input type="date" id="newListDate" />
    <button id="createListBtn" style="width:100%">+ Nova lista por data</button>
    <p class="subtitle">Listas</p>
    <div id="listsContainer"></div>
  </section>

  <!-- TELA: detalhe da lista -->
  <section id="screen-detail" class="screen">
    <div class="back-btn" id="backToListsBtn">← Voltar às listas</div>
    <div id="totalBanner"></div>
    <div class="list-header-bar">
      <button class="secondary" id="toggleFinishedBtn">Marcar como finalizada</button>
      <button class="red" id="deleteListBtn">Excluir lista</button>
    </div>
    <div id="detailContainer"></div>
    <div class="fab">
      <button id="openAddItemBtn" style="width:100%">+ Adicionar item</button>
    </div>
  </section>

</main>

<!-- MODAL: adicionar/editar item -->
<div class="modal-overlay" id="addItemModal">
  <div class="modal-card">
    <h3 id="itemModalTitle">Adicionar item</h3>
    <input type="text" id="itemNameInput" placeholder="O que precisa comprar?" />
    <div class="suggestion-box" id="suggestionBox" style="display:none"></div>

    <p class="subtitle" style="margin-top:8px">Quantidade:</p>
    <div class="qty-row">
      <input type="number" id="itemQtyInput" placeholder="Qtd" min="0" step="0.1" value="1" />
      <select id="itemUnitInput">
        <option value="un">un</option>
        <option value="kg">kg</option>
        <option value="g">g</option>
        <option value="pacote">pacote</option>
        <option value="caixa">caixa</option>
      </select>
    </div>

    <p class="subtitle" id="itemPriceLabel">Preço:</p>
    <div class="qty-row">
      <div style="flex:1">
        <label style="font-size:12px;color:#666;" id="itemUnitPriceLabel">Valor unitário (R$)</label>
        <input type="number" id="itemUnitPriceInput" placeholder="0,00" min="0" step="0.01" />
      </div>
      <div style="flex:1">
        <label style="font-size:12px;color:#666;">Valor total (R$)</label>
        <input type="number" id="itemTotalPriceInput" placeholder="0,00" min="0" step="0.01" />
      </div>
    </div>

    <p class="subtitle">Atribuir para:</p>
    <div class="chip-row" id="assigneeChips"></div>
    <div class="modal-actions">
      <button class="secondary" id="cancelAddItemBtn" style="flex:1">Cancelar</button>
      <button class="green" id="confirmAddItemBtn" style="flex:1">Adicionar</button>
    </div>
  </div>
</div>

<!-- MODAL: reatribuir item -->
<div class="modal-overlay" id="reassignModal">
  <div class="modal-card">
    <h3>Reatribuir item</h3>
    <div class="chip-row" id="reassignChips"></div>
    <div class="modal-actions">
      <button class="secondary" id="cancelReassignBtn" style="flex:1">Cancelar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, orderBy,
  onSnapshot, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2CO9rbsOXE7oCTuS2AnuADlK7h3dA7CU",
  authDomain: "lista-de-comprinha.firebaseapp.com",
  projectId: "lista-de-comprinha",
  storageBucket: "lista-de-comprinha.firebasestorage.app",
  messagingSenderId: "305074638033",
  appId: "1:305074638033:web:fd408d5faa00d0f07989f0",
  measurementId: "G-0JESTJ0KSW"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ---------- estado local ----------
let currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
let users = [];
let lists = [];
let currentListId = null;
let currentList = null;
let items = [];
let library = [];
let selectedAssignee = null;
let reassigningItemId = null;

// ---------- helpers ----------
function formatDate(isoDate) {
  const d = new Date(isoDate + "T00:00:00");
  return d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
}
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.getElementById("switchUserLink").style.display = (id === "screen-user") ? "none" : "inline";
}
function userById(id) {
  return users.find(u => u.id === id);
}
function lighten(hex, amount) {
  // gera uma versão bem clara da cor pra fundo de seção
  try {
    const c = hex.replace("#", "");
    const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
    const nr = Math.round(r + (255-r)*amount), ng = Math.round(g + (255-g)*amount), nb = Math.round(b + (255-b)*amount);
    return `rgb(${nr},${ng},${nb})`;
  } catch(e) { return "#eee"; }
}

// ---------- tela: usuários ----------
function renderUsers() {
  const el = document.getElementById("userList");
  if (users.length === 0) {
    el.innerHTML = '<p class="empty">Nenhum usuário cadastrado ainda.</p>';
    return;
  }
  el.innerHTML = "";
  users.forEach(u => {
    const card = document.createElement("div");
    card.className = "card user-card";
    card.innerHTML = `
      <div class="left">
        <div class="color-dot" style="background:${u.cor || '#1565c0'}"></div>
        <div>
          <div class="name">${u.name}</div>
          ${u.apelido ? `<div class="nick">"${u.apelido}"</div>` : ""}
        </div>
      </div>
      <span class="edit-link">${u.apelido ? "editar" : "+ apelido"}</span>
    `;
    card.querySelector(".left").addEventListener("click", () => chooseUser(u));
    card.querySelector(".edit-link").addEventListener("click", (e) => {
      e.stopPropagation();
      const novo = prompt("Apelido:", u.apelido || "");
      if (novo === null) return;
      const novaCor = prompt("Cor (formato #RRGGBB):", u.cor || "#1565c0");
      const updates = { apelido: novo.trim() };
      if (novaCor && /^#[0-9a-fA-F]{6}$/.test(novaCor.trim())) updates.cor = novaCor.trim();
      updateDoc(doc(db, "users", u.id), updates);
    });
    el.appendChild(card);
  });
}

function chooseUser(u) {
  currentUser = { id: u.id, name: u.name, apelido: u.apelido || "", cor: u.cor || "#1565c0" };
  localStorage.setItem("currentUser", JSON.stringify(currentUser));
  applyTheme(currentUser.cor);
  goToLists();
}

function applyTheme(cor) {
  document.documentElement.style.setProperty("--accent", cor || "#1565c0");
}

document.getElementById("createUserBtn").addEventListener("click", async () => {
  const name = document.getElementById("newUserName").value.trim();
  const apelido = document.getElementById("newUserNick").value.trim();
  const cor = document.getElementById("newUserColor").value;
  if (!name) return;
  const existing = users.find(u => u.name.toLowerCase() === name.toLowerCase());
  if (existing) { chooseUser(existing); return; }
  const ref = await addDoc(collection(db, "users"), { name, apelido, cor });
  chooseUser({ id: ref.id, name, apelido, cor });
});

function showFirebaseError(err) {
  const box = document.createElement("div");
  box.style.cssText = "background:#c62828;color:#fff;padding:14px;font-size:14px;white-space:pre-wrap;font-family:monospace;position:relative;z-index:999;";
  box.textContent = "ERRO FIREBASE: " + (err.code || "") + " " + (err.message || err);
  document.body.prepend(box);
}

onSnapshot(query(collection(db, "users"), orderBy("name")), snap => {
  users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderUsers();
  renderAssigneeChips();
}, showFirebaseError);

// ---------- tela: listas ----------
function goToLists() {
  document.getElementById("helloText").textContent = "Olá, " + (currentUser.apelido || currentUser.name);
  document.getElementById("headerTitle").textContent = "Listas de Compras";
  showScreen("screen-lists");
}

document.getElementById("backToListsBtn").addEventListener("click", () => {
  goToLists();
});

document.getElementById("switchUserLink").addEventListener("click", (e) => {
  e.preventDefault();
  localStorage.removeItem("currentUser");
  currentUser = null;
  showScreen("screen-user");
});

document.getElementById("createListBtn").addEventListener("click", async () => {
  const dateVal = document.getElementById("newListDate").value;
  if (!dateVal) { alert("Escolha uma data"); return; }
  await addDoc(collection(db, "lists"), { date: dateVal, createdBy: currentUser.name, createdAt: new Date(), finalizada: false });
  document.getElementById("newListDate").value = "";
});

function renderLists() {
  const el = document.getElementById("listsContainer");
  if (lists.length === 0) {
    el.innerHTML = '<p class="empty">Nenhuma lista ainda.</p>';
    return;
  }
  const monthNames = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const groups = {};
  lists.forEach(l => {
    const [year, month] = l.date.split("-");
    const key = `${year}-${month}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(l);
  });
  const orderedKeys = Object.keys(groups).sort().reverse();

  el.innerHTML = "";
  orderedKeys.forEach(key => {
    const [year, month] = key.split("-");
    const heading = document.createElement("div");
    heading.className = "month-heading";
    heading.textContent = `${monthNames[parseInt(month, 10) - 1]} de ${year}`;
    el.appendChild(heading);

    let monthTotal = 0;
    groups[key].forEach(l => {
      monthTotal += (typeof l.totalGasto === "number") ? l.totalGasto : 0;
      const card = document.createElement("div");
      card.className = "card list-card";
      card.innerHTML = `
        <div class="top-row">
          <div class="content">
            <div class="date">${formatDate(l.date)}</div>
            <div class="meta">criada por ${l.createdBy}${l.totalGasto ? " · " + formatBRL(l.totalGasto) : ""}</div>
          </div>
          <span class="badge ${l.finalizada ? 'done' : 'pending'}">${l.finalizada ? 'Finalizada' : 'Em andamento'}</span>
        </div>
        <span class="delete-btn">excluir lista</span>
      `;
      card.querySelector(".content").addEventListener("click", () => openList(l.id, formatDate(l.date)));
      card.querySelector(".delete-btn").addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm(`Excluir a lista de ${formatDate(l.date)}? Isso apaga todos os itens dela também.`)) return;
        const itemsSnap = await getDocs(collection(db, "lists", l.id, "items"));
        await Promise.all(itemsSnap.docs.map(d => deleteDoc(doc(db, "lists", l.id, "items", d.id))));
        await deleteDoc(doc(db, "lists", l.id));
      });
      el.appendChild(card);
    });

    if (monthTotal > 0) {
      const totalEl = document.createElement("div");
      totalEl.className = "month-total";
      totalEl.textContent = `Total do mês: ${formatBRL(monthTotal)}`;
      el.appendChild(totalEl);
    }
  });
}

onSnapshot(query(collection(db, "lists"), orderBy("date", "desc")), snap => {
  lists = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderLists();
  renderTodayBanner();
});

function renderTodayBanner() {
  const el = document.getElementById("todayBanner");
  if (!el) return;
  const todayStr = new Date().toISOString().slice(0, 10);
  const todays = lists.filter(l => l.date === todayStr && !l.finalizada);
  if (todays.length === 0) { el.innerHTML = ""; return; }
  const l = todays[0];
  el.innerHTML = `<div class="today-banner">🛒 Hoje é dia de compras! Toque para abrir a lista.</div>`;
  el.querySelector(".today-banner").addEventListener("click", () => openList(l.id, formatDate(l.date)));
}

// ---------- tela: detalhe da lista ----------
let unsubItems = null;

function openList(listId, label) {
  currentListId = listId;
  document.getElementById("headerTitle").textContent = label;
  showScreen("screen-detail");
  if (unsubItems) unsubItems();
  unsubItems = onSnapshot(
    query(collection(db, "lists", listId, "items"), orderBy("createdAt", "asc")),
    snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderDetail();
    }
  );
}

onSnapshot(collection(db, "lists"), snap => {
  if (!currentListId) return;
  const found = snap.docs.find(d => d.id === currentListId);
  if (found) {
    currentList = { id: found.id, ...found.data() };
    document.getElementById("toggleFinishedBtn").textContent = currentList.finalizada
      ? "Reabrir lista"
      : "Marcar como finalizada";
  }
});

document.getElementById("toggleFinishedBtn").addEventListener("click", async () => {
  if (!currentList) return;
  await updateDoc(doc(db, "lists", currentListId), { finalizada: !currentList.finalizada });
});

document.getElementById("deleteListBtn").addEventListener("click", async () => {
  if (!currentListId) return;
  if (!confirm("Excluir esta lista e todos os itens dela?")) return;
  const itemsSnap = await getDocs(collection(db, "lists", currentListId, "items"));
  await Promise.all(itemsSnap.docs.map(d => deleteDoc(doc(db, "lists", currentListId, "items", d.id))));
  await deleteDoc(doc(db, "lists", currentListId));
  currentListId = null;
  goToLists();
});

function renderDetail() {
  const el = document.getElementById("detailContainer");
  const totalBannerEl = document.getElementById("totalBanner");

  // total geral da lista (soma de todos os itens com preço)
  const totalGeral = items.reduce((sum, it) => sum + (typeof it.preco === "number" ? it.preco : 0), 0);
  if (totalBannerEl) {
    totalBannerEl.innerHTML = totalGeral > 0
      ? `<div class="total-banner"><div class="label">Total da compra</div><div class="value">${formatBRL(totalGeral)}</div></div>`
      : "";
  }
  // guarda o total na própria lista, pra usar no agrupamento por mês depois
  if (currentListId) {
    updateDoc(doc(db, "lists", currentListId), { totalGasto: totalGeral }).catch(() => {});
  }

  if (items.length === 0) {
    el.innerHTML = '<p class="empty">Nenhum item ainda. Toque em "+ Adicionar item" abaixo.</p>';
    return;
  }
  const groups = {};
  items.forEach(it => {
    const key = it.assignedToId || "sem";
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  el.innerHTML = "";
  Object.keys(groups).forEach(userId => {
    const group = groups[userId];
    const u = userById(userId);
    const cor = u?.cor || "#777";
    const displayName = u ? (u.apelido || u.name) : "Sem responsável";
    const done = group.filter(i => i.bought).length;
    const totalPessoa = group.reduce((sum, it) => sum + (typeof it.preco === "number" ? it.preco : 0), 0);

    const header = document.createElement("div");
    header.className = "section-header";
    header.style.background = lighten(cor, 0.85);
    header.innerHTML = `
      <span class="title" style="color:${cor}">${displayName}</span>
      <span class="progress" style="color:${cor}">${done}/${group.length}${totalPessoa > 0 ? " · " + formatBRL(totalPessoa) : ""}</span>
    `;
    el.appendChild(header);

    group.forEach(it => {
      const row = document.createElement("div");
      row.className = "item-row";
      const qtyLabel = it.quantidade
        ? `${it.quantidade} ${it.unidade || 'un'}${it.precoUnitario ? ` (${formatBRL(it.precoUnitario)}${(it.unidade === 'kg' || it.unidade === 'g') ? '/kg' : '/un'})` : ""}`
        : "";
      const priceLabel = (typeof it.preco === "number") ? `<span class="price-pill">${formatBRL(it.preco)}</span>` : "";
      row.innerHTML = `
        <div class="checkbox ${it.bought ? "checked" : ""}">${it.bought ? "✓" : ""}</div>
        <div class="item-info">
          <div class="item-text ${it.bought ? "done" : ""}">${it.name}</div>
          ${qtyLabel ? `<div class="item-qty">${qtyLabel}</div>` : ""}
        </div>
        <div class="item-actions">
          ${priceLabel}
          <span class="icon-btn" title="Reatribuir">🔄</span>
          <span class="icon-btn" title="Remover">🗑️</span>
        </div>
      `;
      row.querySelector(".checkbox").addEventListener("click", () => {
        updateDoc(doc(db, "lists", currentListId, "items", it.id), { bought: !it.bought });
      });
      row.querySelector(".item-info").addEventListener("click", () => {
        updateDoc(doc(db, "lists", currentListId, "items", it.id), { bought: !it.bought });
      });
      row.querySelectorAll(".icon-btn")[0].addEventListener("click", () => openReassignModal(it.id));
      row.querySelectorAll(".icon-btn")[1].addEventListener("click", async () => {
        if (!confirm(`Remover "${it.name}" da lista?`)) return;
        await deleteDoc(doc(db, "lists", currentListId, "items", it.id));
      });
      el.appendChild(row);
    });
  });
}

// ---------- modal: adicionar item ----------
let libraryEntries = [];
onSnapshot(collection(db, "library"), snap => {
  libraryEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  library = [...new Set(libraryEntries.map(e => e.name))].sort();
});

function findLibraryPrice(name, unidade) {
  const match = libraryEntries.find(
    e => e.name.toLowerCase() === name.toLowerCase() && e.unidade === unidade
  );
  return match ? match.preco : null;
}

async function saveLibraryPrice(name, unidade, preco) {
  const existing = libraryEntries.find(
    e => e.name.toLowerCase() === name.toLowerCase() && e.unidade === unidade
  );
  if (existing) {
    await updateDoc(doc(db, "library", existing.id), { preco });
  } else {
    await addDoc(collection(db, "library"), { name, unidade, preco });
  }
}

function formatBRL(value) {
  return "R$ " + Number(value).toFixed(2).replace(".", ",");
}

function renderAssigneeChips() {
  const el = document.getElementById("assigneeChips");
  el.innerHTML = "";
  users.forEach(u => {
    const chip = document.createElement("div");
    const isSelected = selectedAssignee?.id === u.id;
    chip.className = "chip" + (isSelected ? " selected" : "");
    chip.style.background = lighten(u.cor || "#1565c0", isSelected ? 0.55 : 0.8);
    chip.style.borderColor = isSelected ? (u.cor || "#1565c0") : "transparent";
    chip.style.color = u.cor || "#1565c0";
    chip.textContent = u.apelido || u.name;
    chip.addEventListener("click", () => { selectedAssignee = u; renderAssigneeChips(); });
    el.appendChild(chip);
  });
}

document.getElementById("openAddItemBtn").addEventListener("click", () => {
  document.getElementById("itemModalTitle").textContent = "Adicionar item";
  document.getElementById("itemNameInput").value = "";
  document.getElementById("itemQtyInput").value = "1";
  document.getElementById("itemUnitInput").value = "un";
  document.getElementById("itemUnitPriceInput").value = "";
  document.getElementById("itemTotalPriceInput").value = "";
  lastPriceEdited = null;
  document.getElementById("itemUnitPriceLabel").textContent = "Valor unitário (R$)";
  document.getElementById("suggestionBox").style.display = "none";
  selectedAssignee = users[0] || null;
  renderAssigneeChips();
  document.getElementById("addItemModal").classList.add("active");
  document.getElementById("itemNameInput").focus();
});

function isWeightUnit(u) {
  return u === "kg" || u === "g";
}

// quantidade "efetiva" para os cálculos: kg convertido quando a unidade é gramas
function quantidadeEfetiva() {
  const unidade = document.getElementById("itemUnitInput").value;
  const quantidade = parseFloat(document.getElementById("itemQtyInput").value) || 0;
  return unidade === "g" ? quantidade / 1000 : quantidade;
}

let lastPriceEdited = null; // "unit" ou "total" — qual campo a pessoa editou por último

function updatePriceFieldUI() {
  const unidade = document.getElementById("itemUnitInput").value;
  document.getElementById("itemUnitPriceLabel").textContent = isWeightUnit(unidade)
    ? "Valor do kg (R$/kg)"
    : "Valor unitário (R$)";
  recalcFromLastEdited();
}

function recalcFromLastEdited() {
  const qtd = quantidadeEfetiva();
  const unitInput = document.getElementById("itemUnitPriceInput");
  const totalInput = document.getElementById("itemTotalPriceInput");
  if (lastPriceEdited === "unit") {
    const unitVal = parseFloat(unitInput.value);
    if (!isNaN(unitVal) && qtd > 0) totalInput.value = (unitVal * qtd).toFixed(2);
  } else if (lastPriceEdited === "total") {
    const totalVal = parseFloat(totalInput.value);
    if (!isNaN(totalVal) && qtd > 0) unitInput.value = (totalVal / qtd).toFixed(2);
  }
}

function tryPrefillPrice() {
  const name = document.getElementById("itemNameInput").value.trim();
  const unidade = document.getElementById("itemUnitInput").value;
  updatePriceFieldUI();
  if (!name) return;
  const lookupUnidade = isWeightUnit(unidade) ? "kg" : unidade;
  const preco = findLibraryPrice(name, lookupUnidade);
  if (preco !== null && preco !== undefined) {
    document.getElementById("itemUnitPriceInput").value = preco;
    lastPriceEdited = "unit";
    recalcFromLastEdited();
  }
}
document.getElementById("itemUnitInput").addEventListener("change", () => {
  updatePriceFieldUI();
});
document.getElementById("itemQtyInput").addEventListener("input", recalcFromLastEdited);
document.getElementById("itemUnitPriceInput").addEventListener("input", () => {
  lastPriceEdited = "unit";
  recalcFromLastEdited();
});
document.getElementById("itemTotalPriceInput").addEventListener("input", () => {
  lastPriceEdited = "total";
  recalcFromLastEdited();
});

document.getElementById("cancelAddItemBtn").addEventListener("click", () => {
  document.getElementById("addItemModal").classList.remove("active");
});

document.getElementById("itemNameInput").addEventListener("input", (e) => {
  const val = e.target.value.trim().toLowerCase();
  const box = document.getElementById("suggestionBox");
  if (!val) { box.style.display = "none"; return; }
  const matches = library.filter(n => n.toLowerCase().includes(val) && n.toLowerCase() !== val).slice(0, 5);
  if (matches.length === 0) { box.style.display = "none"; return; }
  box.innerHTML = "";
  matches.forEach(m => {
    const item = document.createElement("div");
    item.className = "suggestion-item";
    item.textContent = m;
    item.addEventListener("click", () => {
      document.getElementById("itemNameInput").value = m;
      box.style.display = "none";
      tryPrefillPrice();
    });
    box.appendChild(item);
  });
  box.style.display = "block";
});

document.getElementById("confirmAddItemBtn").addEventListener("click", async () => {
  const name = document.getElementById("itemNameInput").value.trim();
  const quantidade = parseFloat(document.getElementById("itemQtyInput").value) || 1;
  const unidade = document.getElementById("itemUnitInput").value;
  const unitRaw = document.getElementById("itemUnitPriceInput").value;
  const totalRaw = document.getElementById("itemTotalPriceInput").value;
  if (!name || !selectedAssignee) { alert("Escreva o item e escolha quem vai comprar"); return; }

  const precoUnitario = unitRaw !== "" ? parseFloat(unitRaw) : null;
  const preco = totalRaw !== "" ? parseFloat(totalRaw) : null;

  const itemData = {
    name,
    quantidade,
    unidade,
    preco,
    assignedToId: selectedAssignee.id,
    assignedToName: selectedAssignee.name,
    assignedToDisplay: selectedAssignee.apelido || selectedAssignee.name,
    bought: false,
    createdAt: new Date(),
  };
  if (precoUnitario !== null) itemData.precoUnitario = precoUnitario;

  await addDoc(collection(db, "lists", currentListId, "items"), itemData);

  if (precoUnitario !== null) {
    const lookupUnidade = isWeightUnit(unidade) ? "kg" : unidade;
    await saveLibraryPrice(name, lookupUnidade, precoUnitario);
  }
  document.getElementById("addItemModal").classList.remove("active");
});

// ---------- modal: reatribuir item ----------
function openReassignModal(itemId) {
  reassigningItemId = itemId;
  const el = document.getElementById("reassignChips");
  el.innerHTML = "";
  users.forEach(u => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.style.background = lighten(u.cor || "#1565c0", 0.8);
    chip.style.color = u.cor || "#1565c0";
    chip.textContent = u.apelido || u.name;
    chip.addEventListener("click", async () => {
      await updateDoc(doc(db, "lists", currentListId, "items", reassigningItemId), {
        assignedToId: u.id,
        assignedToName: u.name,
        assignedToDisplay: u.apelido || u.name,
      });
      document.getElementById("reassignModal").classList.remove("active");
    });
    el.appendChild(chip);
  });
  document.getElementById("reassignModal").classList.add("active");
}

document.getElementById("cancelReassignBtn").addEventListener("click", () => {
  document.getElementById("reassignModal").classList.remove("active");
});

// ---------- inicialização ----------
if (currentUser) {
  applyTheme(currentUser.cor);
  goToLists();
} else {
  showScreen("screen-user");
}
</script>
